<!DOCTYPE html>
<html lang="en">

    <!--title and import stuff-->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Subscrption Tracker</title>

        <!--importing stuff; bootstrap/google fonts/css styles/etc-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;600;700&display=swap" rel="stylesheet">
    </head>


    <body>
        <!-- nav bar; app.js fills this in depending on who is signed in -->
        <nav id="main-nav"></nav>

        <!-- success / error messages show up here -->
        <div id="message-area"></div>

        <!-- title and description -->
        <h1>Subscription Tracker</h1>
        <p>See every subscription you pay for in one place.</p>

        <!-- people who are not signed in see this -->
        <div id="guest-notice" class="alert alert-success d-none">
            Please sign in to see and manage your subscriptions.
            <a href="pages/signin.html" class="btn btn-success btn-sm ms-2">Sign In</a>
        </div>

        <!-- everything below only shows up for signed in users -->
        <div id="app-content" class="d-none">

            <!-- search + filter -->
            <div class="row g-2 mb-3">
                <div class="col-md-5">
                    <label for="search-input" class="form-label">Search</label>
                    <input type="text" class="form-control" id="search-input" placeholder="Search subscriptions...">
                </div>
                <div class="col-md-4">
                    <label for="filter-category" class="form-label">Category</label>
                    <select class="form-select" id="filter-category">
                        <option value="">All</option>
                        <option value="Streaming">Streaming</option>
                        <option value="Music">Music</option>
                        <option value="Software">Software</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button id="search-btn" class="btn btn-success w-100">Search</button>
                </div>
            </div>

            <p id="cost-summary"></p>

            <!-- the cards get made by renderCards() in app.js -->
            <h2 class="mt-4 mb-3">Your Subscriptions</h2>
            <div class="row" id="subscription-list"></div>

            <!-- add / edit form; same form is used for both -->
            <h2 class="mt-4 mb-3" id="form-title">Add New Subscription</h2>
            <form id="add-form">
                <div class="mb-3">
                    <label for="sub-name" class="form-label">Subscription Name</label>
                    <input type="text" class="form-control" id="sub-name" required>
                </div>
                <div class="mb-3">
                    <label for="sub-name-cost" class="form-label">Monthly Cost ($)</label>
                    <input type="number" class="form-control" id="sub-name-cost" min="0" step="0.01" required>
                </div>
                <div class="mb-3">
                    <label for="sub-category" class="form-label">Category</label>
                    <select class="form-select" id="sub-category">
                        <option>Streaming</option>
                        <option>Music</option>
                        <option>Software</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="sub-renewal" class="form-label">Next Renewal Date</label>
                    <input type="date" class="form-control" id="sub-renewal" required>
                </div>
                <div class="mb-3">
                    <label for="sub-status" class="form-label">Status</label>
                    <select class="form-select" id="sub-status">
                        <option>Active</option>
                        <option>Review</option>
                        <option>Cancelled</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success" id="form-submit-btn">Add Subscription</button>
                <button type="button" class="btn btn-outline-secondary d-none" id="cancel-edit-btn">Cancel</button>
            </form>
        </div>


        <!-- footer of index html-->
        <footer>
            <p>Subscription Tracker ·
                <!-- replace the links with my gitHub profile and source code repo-->
                <a href="https://github.com/" target="_blank">GitHub Profile</a> ·
                <a href="https://github.com/" target="_blank">Source Code</a>
            </p>
        </footer>

        <!-- link to bootstrap and js-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/app.js"></script>


        <!-- toast alert welcoming user back -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="status-toast" class="toast" role="alert">
                <div class="toast-header">
                    <strong class="me-auto">Subscription Tracker</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body" id="toast-body">
                    Welcome back!
                </div>
            </div>
        </div>

    </body>
</html>
